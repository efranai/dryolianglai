<svg class="illus" viewBox="0 0 720 372" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="bnum-title bnum-desc">
  <title id="bnum-title">乳房保留手術後加做放射治療的實際效益數字</title>
  <desc id="bnum-desc">根據 EBCTCG 統合分析，接受乳房保留手術的女性加做放射治療後，十年內發生任何復發的風險由百分之三十五降至百分之十九點三，絕對降低百分之十五點七；十五年乳癌死亡風險由百分之二十五點二降至百分之二十一點四，絕對降低百分之三點八。整體而言，每避免四次復發，十五年可少一位乳癌死亡。</desc>

  <!-- 第一組：十年任何復發 -->
  <text class="il-t" x="24" y="42">10 年內發生任何復發</text>

  <text class="il-t-sub il-anchor-end" x="140" y="80">沒有放療</text>
  <rect class="il-bar il-bar--soft" x="152" y="60" width="420" height="28" rx="4" />
  <text class="il-t-val" x="584" y="80">35.0%</text>

  <text class="il-t-sub il-anchor-end" x="140" y="124">接受放療</text>
  <rect class="il-bar il-bar--strong" x="152" y="104" width="232" height="28" rx="4" />
  <text class="il-t-val" x="396" y="124">19.3%</text>

  <text class="il-t-sub il-detail" x="152" y="156">絕對降低 15.7 個百分點——約少了一半</text>

  <!-- 第二組：十五年乳癌死亡 -->
  <text class="il-t" x="24" y="212">15 年乳癌死亡</text>

  <text class="il-t-sub il-anchor-end" x="140" y="250">沒有放療</text>
  <rect class="il-bar il-bar--soft" x="152" y="230" width="302" height="28" rx="4" />
  <text class="il-t-val" x="466" y="250">25.2%</text>

  <text class="il-t-sub il-anchor-end" x="140" y="294">接受放療</text>
  <rect class="il-bar il-bar--strong" x="152" y="274" width="257" height="28" rx="4" />
  <text class="il-t-val" x="421" y="294">21.4%</text>

  <text class="il-t-sub il-detail" x="152" y="326">絕對降低 3.8 個百分點</text>

  <text class="il-t-sub il-detail il-anchor-mid" x="360" y="356">EBCTCG 統合分析：17 項隨機試驗、10,801 位接受乳房保留手術的女性</text>
</svg>
