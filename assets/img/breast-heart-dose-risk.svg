<svg class="illus" viewBox="0 0 720 356" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="risk-title risk-desc">
  <title id="risk-title">心臟平均劑量與心血管風險的關係</title>
  <desc id="risk-desc">Darby 等人的研究顯示，平均心臟劑量每增加 1 格雷，重大冠狀動脈事件的風險約增加百分之七點四，且未觀察到安全閾值。深吸氣閉氣技術常可將平均心臟劑量降至 2 格雷以下。</desc>

  <text class="il-t-sub il-anchor-mid" x="110" y="62">風險增加（%）</text>

  <!-- DIBH 常見的劑量區間 -->
  <rect class="il-band" x="110" y="80" width="327" height="180" />
  <text class="il-t-sub il-anchor-mid" x="230" y="104">DIBH 常可降至此區間</text>

  <!-- 座標軸 -->
  <path class="il-axis" d="M110 74 V260 H610" />

  <!-- 劑量與風險的線性關係 -->
  <path class="il-curve il-curve--cancer" d="M110 260 L273 207 L437 153 L600 100" />
  <circle class="il-point" cx="273" cy="207" r="6" />
  <circle class="il-point" cx="437" cy="153" r="6" />
  <circle class="il-point" cx="600" cy="100" r="6" />

  <text class="il-t-val il-anchor-mid" x="273" y="195">+7.4%</text>
  <text class="il-t-val il-anchor-mid" x="437" y="141">+14.8%</text>
  <text class="il-t-val il-anchor-mid" x="600" y="88">+22.2%</text>

  <!-- 刻度 -->
  <g class="il-tick"><path d="M273 260 v8 M437 260 v8 M600 260 v8" /></g>
  <g class="il-t-sub il-anchor-mid">
    <text x="110" y="292">0</text>
    <text x="273" y="292">1</text>
    <text x="437" y="292">2</text>
    <text x="600" y="292">3</text>
  </g>

  <text class="il-t-sub il-anchor-mid" x="360" y="336">平均心臟劑量（Gy）</text>
</svg>
