<svg class="illus" viewBox="0 0 720 448" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="scene-title scene-desc">
  <title id="scene-title">光子與質子在體內釋放能量的比較</title>
  <desc id="scene-desc">同一位病人、同一個腫瘤深度的比較。光子進入人體後很快達到劑量高峰，之後一路衰減但持續穿透，通過腫瘤後方仍會留下劑量。質子進入時只釋放少量能量，在腫瘤所在的深度形成布拉格峰後劑量迅速歸零，腫瘤後方幾乎不再受到照射。上下兩排的水平位置代表相同的體內深度。</desc>

  <!-- 腫瘤深度標示（貫穿上下兩排） -->
  <text class="il-t il-anchor-mid" x="468" y="46">腫瘤</text>
  <rect class="il-depth-band" x="444" y="58" width="49" height="312" rx="4" />

  <!-- ===== 上排：光子 ===== -->
  <text class="il-t il-anchor-end" x="138" y="112">光子</text>
  <text class="il-t-sub il-anchor-end il-detail" x="138" y="136">X 光</text>

  <g class="il-dose">
    <rect x="150" y="84" width="49" height="44" opacity=".85" />
    <rect x="199" y="84" width="49" height="44" opacity=".80" />
    <rect x="248" y="84" width="49" height="44" opacity=".74" />
    <rect x="297" y="84" width="49" height="44" opacity=".68" />
    <rect x="346" y="84" width="49" height="44" opacity=".62" />
    <rect x="395" y="84" width="49" height="44" opacity=".56" />
    <rect x="444" y="84" width="49" height="44" opacity=".50" />
    <rect x="493" y="84" width="49" height="44" opacity=".44" />
    <rect x="542" y="84" width="49" height="44" opacity=".38" />
    <rect x="591" y="84" width="49" height="44" opacity=".32" />
  </g>
  <rect class="il-tissue" x="150" y="84" width="490" height="44" rx="6" />

  <path class="il-axis" d="M150 200 H640" />
  <path class="il-curve il-curve--cancer"
        d="M150 200 L172 148 C212 140 282 156 362 167 C442 176 552 184 640 188" />
  <text class="il-t-sub il-anchor-mid" x="395" y="228">通過腫瘤後，後方組織仍持續接受劑量</text>

  <!-- ===== 下排：質子 ===== -->
  <text class="il-t il-anchor-end" x="138" y="282">質子</text>

  <g class="il-dose">
    <rect x="150" y="254" width="49" height="44" opacity=".16" />
    <rect x="199" y="254" width="49" height="44" opacity=".18" />
    <rect x="248" y="254" width="49" height="44" opacity=".21" />
    <rect x="297" y="254" width="49" height="44" opacity=".25" />
    <rect x="346" y="254" width="49" height="44" opacity=".29" />
    <rect x="395" y="254" width="49" height="44" opacity=".34" />
    <rect x="444" y="254" width="49" height="44" opacity=".95" />
    <rect x="493" y="254" width="49" height="44" opacity=".04" />
    <rect x="542" y="254" width="49" height="44" opacity=".03" />
    <rect x="591" y="254" width="49" height="44" opacity=".02" />
  </g>
  <rect class="il-tissue" x="150" y="254" width="490" height="44" rx="6" />

  <path class="il-axis" d="M150 370 H640" />
  <path class="il-curve il-curve--normal"
        d="M150 364 L280 358 L380 348 C420 342 444 334 456 322 C462 314 470 310 476 320 C482 334 486 352 490 370 L640 370" />
  <text class="il-t-sub il-anchor-mid" x="395" y="398">在腫瘤深度形成布拉格峰後，劑量迅速歸零</text>

  <text class="il-t-sub il-anchor-mid" x="360" y="436">色塊深淺代表該深度接受的劑量；由左至右為進入身體的深度</text>
</svg>
