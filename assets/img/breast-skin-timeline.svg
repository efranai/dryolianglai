<svg class="illus" viewBox="0 0 720 344" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="skintime-title skintime-desc">
  <title id="skintime-title">乳癌放射治療期間皮膚反應的時間變化示意圖</title>
  <desc id="skintime-desc">皮膚反應是慢慢累積的。治療前一到兩週大多沒有明顯感覺；第二到四週開始出現泛紅、乾燥與輕微搔癢；治療後期可能有色素沉著與輕微脫皮，程度在療程結束前後最明顯；結束後約兩到四週逐漸改善，色素沉著多在數個月至一年內淡化。</desc>

  <text class="il-t-sub" x="52" y="34">皮膚反應程度</text>

  <!-- 三個階段的底色區塊 -->
  <rect class="il-band" x="52" y="46" width="212" height="210" rx="12" />
  <rect class="il-band il-band--warm" x="270" y="46" width="196" height="210" rx="12" />
  <rect class="il-band" x="472" y="46" width="196" height="210" rx="12" />

  <text class="il-t il-anchor-mid" x="158" y="76">治療前期</text>
  <text class="il-t-sub il-detail il-anchor-mid" x="158" y="104">第 1～2 週</text>
  <text class="il-t-sub il-detail il-anchor-mid" x="158" y="126">大多沒有明顯感覺</text>

  <text class="il-t il-anchor-mid" x="368" y="76">治療中後期</text>
  <text class="il-t-sub il-detail il-anchor-mid" x="368" y="104">第 2～4 週起泛紅、乾燥</text>
  <text class="il-t-sub il-detail il-anchor-mid" x="368" y="126">後期可能色素沉著、脫皮</text>

  <text class="il-t il-anchor-mid" x="570" y="76">治療結束後</text>
  <text class="il-t-sub il-detail il-anchor-mid" x="570" y="104">約 2～4 週逐漸改善</text>
  <text class="il-t-sub il-detail il-anchor-mid" x="570" y="126">色素多在數月至一年淡化</text>

  <!-- 反應程度曲線：緩慢累積、療程結束前後最明顯、之後回落 -->
  <path class="il-curve il-curve--cancer"
        d="M64 238 C 130 236 200 226 264 212 C 320 200 356 182 400 174 C 428 169 448 172 466 180 C 512 200 560 220 610 230 C 632 234 646 236 658 237" />

  <!-- 療程結束的時間點 -->
  <path class="il-tick" d="M466 46 V 256" />
  <circle class="il-point" cx="466" cy="180" r="6" />

  <!-- 時間軸 -->
  <path class="il-axis" d="M52 268 H 682" />
  <path class="il-axis-head" d="M682 262 694 268 682 274Z" />
  <path class="il-tick" d="M64 264 V 274M466 264 V 274" />
  <text class="il-t-sub" x="56" y="296">治療開始</text>
  <text class="il-t-sub il-anchor-mid" x="466" y="296">療程結束</text>
  <text class="il-t-sub il-anchor-end" x="682" y="296">時間</text>

  <text class="il-t-sub il-anchor-mid" x="360" y="332">皮膚反應通常在療程結束前後最明顯，之後會慢慢恢復</text>
</svg>
