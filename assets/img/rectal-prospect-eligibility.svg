<svg class="illus" viewBox="0 0 720 350" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="rpel-title rpel-desc">
  <title id="rpel-title">PROSPECT 試驗結論的適用範圍</title>
  <desc id="rpel-desc">PROSPECT 試驗只收臨床分期為 T2 併淋巴結轉移、或 T3 有無淋巴結轉移皆可，而且必須是可以保留括約肌的手術候選人。美國放射腫瘤學會指出，該結論不適用於腫瘤較大、位置太低靠近肛門、或多顆淋巴結腫大的病人；希望以觀察等待避免開刀的病人，化療與放射治療仍然都需要。</desc>

  <g class="il-node il-node--accent">
    <rect x="24" y="42" width="326" height="238" rx="14" />
  </g>
  <text class="il-t il-node-text--on il-anchor-mid" x="187" y="84">結論適用於</text>
  <text class="il-t-sub il-node-text--on il-anchor-mid" x="187" y="132">cT2 併淋巴結轉移</text>
  <text class="il-t-sub il-node-text--on il-anchor-mid" x="187" y="170">cT3（有無淋巴結皆可）</text>
  <text class="il-t-sub il-node-text--on il-anchor-mid" x="187" y="208">且可保留括約肌</text>
  <text class="il-t-sub il-detail il-node-text--on il-anchor-mid" x="187" y="246">也就是排除了需要永久造口的人</text>

  <g class="il-node il-node--soft">
    <rect x="370" y="42" width="326" height="238" rx="14" />
  </g>
  <text class="il-t il-anchor-mid" x="533" y="84">不適用於</text>
  <text class="il-t-sub il-anchor-mid" x="533" y="132">腫瘤較大</text>
  <text class="il-t-sub il-anchor-mid" x="533" y="170">位置太低、靠近肛門</text>
  <text class="il-t-sub il-anchor-mid" x="533" y="208">多顆淋巴結腫大</text>
  <text class="il-t-sub il-anchor-mid" x="533" y="246">想避免開刀、保留器官者</text>

  <text class="il-t-sub il-anchor-mid" x="360" y="322">這幾項都不是用 T 分期定義的</text>
</svg>
