<svg class="illus" viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="rcti-title rcti-desc">
  <title id="rcti-title">短療程與長療程的放射治療次數比較</title>
  <desc id="rcti-desc">短療程是一週五次，每一次的劑量比較高。長療程是五週二十五次，每次劑量較低，之後常再針對腫瘤加照幾次。至於化學治療怎麼搭配、排在放射治療前面還是後面，每個人的計畫都不一樣。</desc>

  <text class="il-t" x="24" y="42">短療程</text>
  <text class="il-t-sub il-anchor-end" x="696" y="42">1 週 · 5 次 · 每次劑量高</text>

  <g class="il-day il-day--on">
    <rect x="24"  y="62" width="46" height="40" rx="7" />
    <rect x="78"  y="62" width="46" height="40" rx="7" />
    <rect x="132" y="62" width="46" height="40" rx="7" />
    <rect x="186" y="62" width="46" height="40" rx="7" />
    <rect x="240" y="62" width="46" height="40" rx="7" />
  </g>

  <text class="il-t" x="24" y="180">長療程</text>
  <text class="il-t-sub il-anchor-end" x="696" y="180">5 週 · 25 次 · 每次劑量低</text>

  <g class="il-day il-day--on">
    <rect x="24"  y="200" width="20" height="40" rx="5" /><rect x="50"  y="200" width="20" height="40" rx="5" />
    <rect x="76"  y="200" width="20" height="40" rx="5" /><rect x="102" y="200" width="20" height="40" rx="5" />
    <rect x="128" y="200" width="20" height="40" rx="5" /><rect x="162" y="200" width="20" height="40" rx="5" />
    <rect x="188" y="200" width="20" height="40" rx="5" /><rect x="214" y="200" width="20" height="40" rx="5" />
    <rect x="240" y="200" width="20" height="40" rx="5" /><rect x="266" y="200" width="20" height="40" rx="5" />
    <rect x="300" y="200" width="20" height="40" rx="5" /><rect x="326" y="200" width="20" height="40" rx="5" />
    <rect x="352" y="200" width="20" height="40" rx="5" /><rect x="378" y="200" width="20" height="40" rx="5" />
    <rect x="404" y="200" width="20" height="40" rx="5" /><rect x="438" y="200" width="20" height="40" rx="5" />
    <rect x="464" y="200" width="20" height="40" rx="5" /><rect x="490" y="200" width="20" height="40" rx="5" />
    <rect x="516" y="200" width="20" height="40" rx="5" /><rect x="542" y="200" width="20" height="40" rx="5" />
    <rect x="576" y="200" width="20" height="40" rx="5" /><rect x="602" y="200" width="20" height="40" rx="5" />
    <rect x="628" y="200" width="20" height="40" rx="5" /><rect x="654" y="200" width="20" height="40" rx="5" />
    <rect x="680" y="200" width="20" height="40" rx="5" />
  </g>
  <g class="il-day il-day--ghost">
    <rect x="24" y="252" width="20" height="40" rx="5" /><rect x="50" y="252" width="20" height="40" rx="5" />
    <rect x="76" y="252" width="20" height="40" rx="5" />
  </g>
  <text class="il-t-sub" x="112" y="280">常再加照幾次（boost）</text>

  <text class="il-t-sub il-anchor-mid" x="360" y="324">化療怎麼搭、排在前面還是後面，每個人都不一樣</text>
</svg>
