<svg class="illus" viewBox="0 0 720 332" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="mat-title mat-desc">
  <title id="mat-title">各種療程的證據成熟度</title>
  <desc id="mat-desc">15 至 20 次的短療程證據最完整；5 次部分乳房照射（APBI）對符合條件者已相當成熟；5 次全乳的超短療程已有大型研究支持但仍持續發展中；術中放射治療目前並不建議作為大部分病人的常規治療。</desc>

  <text class="il-t il-anchor-mid" x="360" y="40">不同療程的證據成熟度</text>
  <text class="il-t-sub il-anchor-mid" x="360" y="82">左：證據最完整　→　右：仍在發展中</text>

  <rect class="il-band" x="100" y="158" width="520" height="24" rx="12" />
  <path class="il-axis" d="M100 170 H620" />

  <!-- 標示線 -->
  <path class="il-lead" d="M160 161 V136 M300 179 V208 M450 161 V136 M580 179 V208" />

  <circle class="il-point" cx="160" cy="170" r="9" />
  <circle class="il-point" cx="300" cy="170" r="9" />
  <circle class="il-point" cx="450" cy="170" r="9" />
  <circle class="il-point" cx="580" cy="170" r="9" />

  <text class="il-t il-anchor-mid" x="160" y="126">短療程</text>
  <text class="il-t il-anchor-mid" x="300" y="232">APBI</text>
  <text class="il-t il-anchor-mid" x="450" y="126">超短療程</text>
  <text class="il-t il-anchor-mid" x="580" y="232">IORT</text>

  <text class="il-t-sub il-anchor-mid il-detail" x="580" y="268">不建議常規使用</text>

  <text class="il-t-sub il-anchor-mid" x="360" y="312">次數較少不代表較新或較好，關鍵是證據是否足夠支持</text>
</svg>
