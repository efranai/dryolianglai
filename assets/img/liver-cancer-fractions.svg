  <rect class="il-bar il-bar--soft" x="376" y="150" width="10" height="20" rx="3" />
  <rect class="il-bar il-bar--soft" x="390" y="150" width="10" height="20" rx="3" />
  <rect class="il-bar il-bar--soft" x="404" y="150" width="10" height="20" rx="3" />
  <text class="il-t-val" x="428" y="167">20 幾次</text>

  <text class="il-t-sub il-anchor-mid" x="360" y="232">腫瘤大、貼近腸胃道、剩下的肝不多時，會傾向拆細</text>
