  <rect class="il-bar il-bar--soft" x="292" y="150" width="10" height="20" rx="3" />
  <rect class="il-bar il-bar--soft" x="306" y="150" width="10" height="20" rx="3" />
  <rect class="il-bar il-bar--soft" x="320" y="150" width="10" height="20" rx="3" />
  <rect class="il-bar il-bar--soft" x="334" y="150" width="10" height="20" rx="3" />
