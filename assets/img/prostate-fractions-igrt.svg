<svg class="illus" viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="pfig-title pfig-desc">
  <title id="pfig-title">攝護腺位置每天會變，所以每次治療前要先對位</title>
  <desc id="pfig-desc">攝護腺前面是膀胱、後面是直腸，膀胱的尿量與直腸裡的氣體和糞便都會推移攝護腺的位置。因此每次治療前都要先拍影像確認位置再照射，療程次數愈少，這一步就愈重要。</desc>

  <g class="il-node il-node--soft">
    <rect x="24" y="42" width="326" height="214" rx="14" />
  </g>
  <text class="il-t il-anchor-mid" x="187" y="84">位置每天都會變</text>
  <text class="il-t-sub il-anchor-mid" x="187" y="136">前面是膀胱的尿量</text>
  <text class="il-t-sub il-anchor-mid" x="187" y="176">後面是直腸的氣體</text>
  <text class="il-t-sub il-anchor-mid" x="187" y="216">都會推移攝護腺</text>

  <g class="il-node il-node--accent">
    <rect x="370" y="42" width="326" height="214" rx="14" />
  </g>
  <text class="il-t il-node-text--on il-anchor-mid" x="533" y="84">每次先對位</text>
  <text class="il-t-sub il-node-text--on il-anchor-mid" x="533" y="136">治療前先拍影像</text>
  <text class="il-t-sub il-node-text--on il-anchor-mid" x="533" y="176">確認位置再照射</text>
  <text class="il-t-sub il-node-text--on il-anchor-mid" x="533" y="216">次數愈少愈重要</text>

  <text class="il-t il-anchor-mid" x="360" y="300">能對得準，才談得上縮短</text>
</svg>
