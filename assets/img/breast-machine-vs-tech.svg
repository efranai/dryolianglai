<svg class="illus" viewBox="0 0 720 366" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="mvt-title mvt-desc">
  <title id="mvt-title">機器名稱與放射治療技術的區別</title>
  <desc id="mvt-desc">好神刀、螺旋刀、質子治療機都是機器的名稱；真正決定治療品質的是機器能運用哪些放射治療技術，包括 IMRT 強度調控、IGRT 影像導引、DIBH 深吸氣閉氣，以及質子治療。</desc>

  <text class="il-t-sub il-anchor-mid" x="170" y="48">機器名稱</text>
  <text class="il-t-sub il-anchor-mid" x="550" y="48">真正決定品質的技術</text>

  <!-- 左：機器 -->
  <g class="il-node il-node--soft"><rect x="40" y="70" width="260" height="74" rx="12" /></g>
  <text class="il-t il-anchor-mid" x="170" y="104">好神刀</text>
  <text class="il-t-sub il-anchor-mid il-detail" x="170" y="128">Halcyon</text>

  <g class="il-node il-node--soft"><rect x="40" y="156" width="260" height="74" rx="12" /></g>
  <text class="il-t il-anchor-mid" x="170" y="190">螺旋刀</text>
  <text class="il-t-sub il-anchor-mid il-detail" x="170" y="214">Tomotherapy</text>

  <g class="il-node il-node--soft"><rect x="40" y="242" width="260" height="74" rx="12" /></g>
  <text class="il-t il-anchor-mid" x="170" y="276">質子治療機</text>
  <text class="il-t-sub il-anchor-mid il-detail" x="170" y="300">ProBeam</text>

  <!-- 中間箭頭 -->
  <path class="il-arrow" d="M316 193 H392" />
  <path class="il-arrow-head" d="M392 186 l12 7 l-12 7 z" />

  <!-- 右：技術 -->
  <g class="il-node il-node--accent"><rect x="420" y="70" width="260" height="56" rx="12" /></g>
  <text class="il-t il-anchor-mid il-node-text--on" x="550" y="106">IMRT 強度調控</text>

  <g class="il-node il-node--accent"><rect x="420" y="132" width="260" height="56" rx="12" /></g>
  <text class="il-t il-anchor-mid il-node-text--on" x="550" y="168">IGRT 影像導引</text>

  <g class="il-node il-node--accent"><rect x="420" y="194" width="260" height="56" rx="12" /></g>
  <text class="il-t il-anchor-mid il-node-text--on" x="550" y="230">DIBH 深吸氣閉氣</text>

  <g class="il-node il-node--accent"><rect x="420" y="256" width="260" height="56" rx="12" /></g>
  <text class="il-t il-anchor-mid il-node-text--on" x="550" y="292">質子治療</text>

  <text class="il-t-sub il-anchor-mid" x="360" y="352">機器只是載具，真正影響治療品質的是這些技術</text>
</svg>
