<svg class="illus" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="rptox-title rptox-desc">
  <title id="rptox-title">兩種術前治療的副作用在不同時期各有輕重</title>
  <desc id="rptox-desc">治療期間，先做化療這一組的嚴重不良事件為百分之四十一，放化療組為百分之二十三，周邊神經病變的差距尤其明顯；但腹瀉則是放化療組較高。術後六到十八個月則相反，化療組的疲倦與神經病變較少、性功能較好，不過此時放化療組仍有將近一半的人正在接受術後化療。兩者不是高低之分，而是形狀不同。</desc>

  <text class="il-t" x="24" y="40">治療期間</text>
  <text class="il-t" x="370" y="40">術後 6～18 個月</text>

  <g class="il-node il-node--soft">
    <rect x="24" y="56" width="326" height="158" rx="14" />
  </g>
  <text class="il-t-sub il-anchor-mid" x="187" y="90">嚴重不良事件（第 3 級以上）</text>
  <text class="il-t-val il-anchor-mid" x="120" y="132">41.0%</text>
  <text class="il-t-val il-anchor-mid" x="254" y="132">22.8%</text>
  <text class="il-t-sub il-anchor-mid" x="120" y="172">先化療</text>
  <text class="il-t-sub il-anchor-mid" x="254" y="172">放化療</text>
  <text class="il-t-sub il-detail il-anchor-mid" x="187" y="206">神經病變差最多；腹瀉則反過來</text>

  <g class="il-node il-node--soft">
    <rect x="370" y="56" width="326" height="158" rx="14" />
  </g>
  <text class="il-t-sub il-anchor-mid" x="533" y="90">疲倦、神經病變、性功能</text>
  <text class="il-t il-anchor-mid" x="533" y="134">先化療這組較好</text>
  <text class="il-t-sub il-detail il-anchor-mid" x="533" y="172">但此時放化療組仍有 49.8%</text>
  <text class="il-t-sub il-detail il-anchor-mid" x="533" y="200">正在接受化療，前者只剩 9.5%</text>

  <text class="il-t il-anchor-mid" x="360" y="262">不是高低之分，而是形狀不同</text>
  <text class="il-t-sub il-anchor-mid" x="360" y="304">辛苦的時間點不一樣，難受的項目也不一樣</text>
  <text class="il-t-sub il-detail il-anchor-mid" x="360" y="338">哪一種比較難受，取決於您最在意哪些症狀</text>
</svg>
