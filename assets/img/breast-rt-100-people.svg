<svg class="illus" viewBox="0 0 720 390" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="b100-title b100-desc">
  <title id="b100-title">每一百位做完放射治療的早期乳癌病人，十年內的局部復發</title>
  <desc id="b100-desc">在近年的大型試驗中，接受乳房保留手術並完成標準放射治療的早期乳癌病人，十年之內大約每一百位有四位會在同一側乳房再出現問題，其餘九十六位不會。收案對象為各年齡層、腫瘤三公分左右以內、淋巴結零到三顆的病人。</desc>

  <text class="il-t il-anchor-mid" x="360" y="42">每 100 位做完放射治療的早期乳癌病人</text>

