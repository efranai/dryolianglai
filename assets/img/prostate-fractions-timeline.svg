    <rect x="598" y="62" width="11" height="40" rx="3" />
    <rect x="619" y="62" width="11" height="40" rx="3" /><rect x="635" y="62" width="11" height="40" rx="3" />
    <rect x="651" y="62" width="11" height="40" rx="3" /><rect x="667" y="62" width="11" height="40" rx="3" />
    <rect x="683" y="62" width="11" height="40" rx="3" />
  </g>

  <text class="il-t" x="24" y="180">少分次療程</text>
  <text class="il-t-sub il-anchor-end" x="696" y="180">約 4～5 週 · 20 幾次</text>

  <g class="il-day il-day--on">
    <rect x="24"  y="200" width="11" height="40" rx="3" /><rect x="40"  y="200" width="11" height="40" rx="3" />
