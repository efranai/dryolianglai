    <rect x="428" y="62" width="11" height="40" rx="3" />
    <rect x="449" y="62" width="11" height="40" rx="3" /><rect x="465" y="62" width="11" height="40" rx="3" />
    <rect x="481" y="62" width="11" height="40" rx="3" /><rect x="497" y="62" width="11" height="40" rx="3" />
    <rect x="513" y="62" width="11" height="40" rx="3" />
    <rect x="534" y="62" width="11" height="40" rx="3" /><rect x="550" y="62" width="11" height="40" rx="3" />
