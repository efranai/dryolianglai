<svg class="illus" viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="pfti-title pfti-desc">
  <title id="pfti-title">傳統療程與少分次療程的長度比較</title>
  <desc id="pfti-desc">兩排都以八週為底，每一格代表一次治療，每週五格。傳統療程約三十八到四十四次，八週的格子會全部填滿。少分次療程約二十幾次，大約填到第四到第五週就結束，後面三、四週不必再跑。</desc>

  <text class="il-t" x="24" y="42">傳統療程</text>
  <text class="il-t-sub il-anchor-end" x="696" y="42">約 8 週 · 38～44 次</text>

  <g class="il-day il-day--on">
    <rect x="24"  y="62" width="11" height="40" rx="3" /><rect x="40"  y="62" width="11" height="40" rx="3" />
    <rect x="56"  y="62" width="11" height="40" rx="3" /><rect x="72"  y="62" width="11" height="40" rx="3" />
    <rect x="88"  y="62" width="11" height="40" rx="3" />
    <rect x="109" y="62" width="11" height="40" rx="3" /><rect x="125" y="62" width="11" height="40" rx="3" />
