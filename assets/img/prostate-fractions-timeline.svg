  <title id="pfti-title">傳統療程與少分次療程的長度比較</title>
  <desc id="pfti-desc">傳統療程約三十八到四十四次，扣掉週末大約要跑八週。少分次療程約二十幾次，大約四到五週就能完成。每一格代表一次治療，以每週五次排列。</desc>

