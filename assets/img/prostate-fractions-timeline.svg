    <rect x="226" y="62" width="11" height="40" rx="3" /><rect x="242" y="62" width="11" height="40" rx="3" />
    <rect x="258" y="62" width="11" height="40" rx="3" />
    <rect x="279" y="62" width="11" height="40" rx="3" /><rect x="295" y="62" width="11" height="40" rx="3" />
    <rect x="311" y="62" width="11" height="40" rx="3" /><rect x="327" y="62" width="11" height="40" rx="3" />
    <rect x="343" y="62" width="11" height="40" rx="3" />
    <rect x="364" y="62" width="11" height="40" rx="3" /><rect x="380" y="62" width="11" height="40" rx="3" />
