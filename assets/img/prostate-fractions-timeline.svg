    <rect x="566" y="200" width="11" height="40" rx="3" /><rect x="582" y="200" width="11" height="40" rx="3" />
    <rect x="598" y="200" width="11" height="40" rx="3" />
    <rect x="619" y="200" width="11" height="40" rx="3" /><rect x="635" y="200" width="11" height="40" rx="3" />
    <rect x="651" y="200" width="11" height="40" rx="3" /><rect x="667" y="200" width="11" height="40" rx="3" />
