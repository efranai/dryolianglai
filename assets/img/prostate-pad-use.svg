<svg class="illus" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="pad-title pad-desc">
  <title id="pad-title">尿墊使用比例隨時間改善的比較</title>
  <desc id="pad-desc">ProtecT 試驗中仍需使用尿墊的比例：治療後 6 個月，手術約 46%、放射治療約 5%；到了 6 年追蹤時，手術降至約 17%、放射治療約 4%。顯示大部分病人的尿控功能會隨時間逐漸改善。</desc>

  <text class="il-t il-anchor-mid" x="360" y="36">尿控功能會隨時間逐漸改善</text>

  <!-- 圖例 -->
  <rect class="il-bar il-bar--surgery" x="270" y="66" width="18" height="13" rx="3" />
  <text class="il-t-sub" x="296" y="78">手術</text>
  <rect class="il-bar il-bar--rt" x="360" y="66" width="18" height="13" rx="3" />
  <text class="il-t-sub" x="386" y="78">放射治療</text>

  <path class="il-axis" d="M100 268 H620" />

  <!-- 治療後 6 個月 -->
  <rect class="il-bar il-bar--surgery" x="160" y="118" width="62" height="150" rx="5" />
  <rect class="il-bar il-bar--rt"      x="238" y="252" width="62" height="16"  rx="5" />
  <text class="il-t-val il-anchor-mid" x="191" y="110">46%</text>
  <text class="il-t-val il-anchor-mid" x="269" y="244">5%</text>
  <text class="il-t il-anchor-mid" x="230" y="306">治療後 6 個月</text>

  <!-- 治療後 6 年 -->
  <rect class="il-bar il-bar--surgery" x="420" y="213" width="62" height="55" rx="5" />
  <rect class="il-bar il-bar--rt"      x="498" y="255" width="62" height="13" rx="5" />
  <text class="il-t-val il-anchor-mid" x="451" y="205">17%</text>
  <text class="il-t-val il-anchor-mid" x="529" y="247">4%</text>
  <text class="il-t il-anchor-mid" x="490" y="306">治療後 6 年</text>

  <text class="il-t-sub il-anchor-mid" x="360" y="344">ProtecT Trial：治療後仍需要使用尿墊的比例</text>
</svg>
